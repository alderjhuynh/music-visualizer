name: Analyze tracks & deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install analysis dependencies
        run: pip install -r scripts/requirements.txt

      - name: Assemble static site into dist/
        run: |
          mkdir -p dist/tracks
          cp site/*.html site/*.css site/*.js dist/
          cp albums.json dist/
          if compgen -G "tracks/*.mp3" > /dev/null; then
            cp tracks/*.mp3 dist/tracks/
          fi
          for dir in albums/*/; do
            id=$(basename "$dir")
            mkdir -p "dist/albums/$id/tracks"
            if compgen -G "${dir}tracks/*.mp3" > /dev/null; then
              cp "${dir}"tracks/*.mp3 "dist/albums/$id/tracks/"
            fi
          done

      - name: Analyze audio -> manifest.json + data/*.json (per album)
        run: |
          python scripts/analyze.py --tracks tracks --out dist --meta tracks.meta.json
          for dir in albums/*/; do
            id=$(basename "$dir")
            python scripts/analyze.py \
              --tracks "${dir}tracks" \
              --out "dist/albums/$id" \
              --meta "${dir}tracks.meta.json"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
