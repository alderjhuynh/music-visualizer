<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>HEAR ME AND WEEP</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="stage" id="stage">

    <div class="edge edge-left" id="edgeLeft">auraea</div>
    <div class="edge edge-right">
      <div class="edge-right-track" id="edgeRight">— — —</div>
    </div>

    <canvas id="canvas"></canvas>

    <div class="hud">
      <div class="hud-top">
        <div class="album-switcher" id="albumSwitcher"></div>
        <div class="key-label" id="keyLabel">—</div>
        <div class="notes-row">
          <span class="notes-caption">Notes:</span>
          <span class="notes-values" id="notesValues">—</span>
          <span class="swatch"></span>
          <span class="swatch"></span>
        </div>
      </div>

      <div class="hud-stats" id="hudStats">
        <div id="onsetStat">events 0/0 (0.0%)</div>
        <div id="beatStat">beats 0/0 (0.0%)</div>
      </div>

      <div class="hud-cluster">
        <div class="hud-bottom">
          <div class="meters">
            <div class="meter-labels"><span>L</span><span>R</span></div>
            <div class="meter-track">
              <div class="meter-bar" id="meterL"></div>
              <div class="meter-bar" id="meterR"></div>
            </div>
          </div>

          <div class="counters">
            <div><span class="counter-label">bar</span><span class="counter-value" id="barCount">000</span></div>
            <div><span class="counter-label">beat</span><span class="counter-value" id="beatCount">00</span></div>
            <div class="time-block">
              <span class="counter-label">time</span>
              <span class="counter-value" id="timeCount">0:00</span>
            </div>
          </div>

          <div class="waveform-wrap">
            <canvas id="waveCanvas"></canvas>
            <div class="progress-track" id="progressTrack">
              <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="time-readout" id="timeReadout">0:00 / 0:00</div>
          </div>
        </div>

        <div class="transport">
          <button id="modeBtn" class="circle-btn" aria-label="Playback mode"></button>
          <button id="playBtn" class="circle-btn" aria-label="Play / pause"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" focusable="false" fill="currentColor"><path d="M8 5.14v14l11-7z"></path></svg></button>
          <div class="tracklist" id="tracklist"></div>
        </div>

        <div class="marquee-wrap">
          <div class="marquee" id="marquee">—</div>
        </div>
      </div>
    </div>

    <div class="invert-corner invert-tr" aria-hidden="true"></div>
    <div class="invert-corner invert-bl" aria-hidden="true"></div>

  </div>

  <audio id="audio" preload="auto" crossorigin="anonymous"></audio>
  <script src="app.js"></script>
</body>
</html>
